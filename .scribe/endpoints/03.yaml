  -
    custom: []
    httpMethods:
      - POST
    uri: 'api/v1/chat/conversations/{id}/messages'
    metadata:
      custom: []
      groupName: 'Dija Chat'
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Send a message (SSE stream)'
      description: |-
        Posts a user message and streams the assistant reply back as Server-Sent Events
        (`Content-Type: text/event-stream`) — this endpoint does NOT return JSON. Each
        event is a `data:` line with one of these payloads:

            data: {"type":"token","content":"..."}   ← one per streamed token
            data: {"type":"done"}                      ← stream finished successfully
            data: {"type":"error","message":"..."}    ← quota exceeded or failure

        After the stream closes, the user + assistant messages are persisted and the
        caller's daily token usage is incremented. In Phase 1 the assistant is the echo
        provider; the real LLM arrives in task 14.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {SANCTUM_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      id:
        custom: []
        name: id
        description: 'The conversation ID.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      id: 1
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      content:
        custom: []
        name: content
        description: "The user's message (max 4000 chars)."
        required: true
        example: 'Kur e kam orën tjetër?'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      content: 'Kur e kam orën tjetër?'
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          data: {"type":"token","content":"[Dija "}

          data: {"type":"done"}
        headers: []
        description: ''
      -
        custom: []
        status: 404
        content: '{"data": null, "message": "Not Found", "status": 404}'
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
